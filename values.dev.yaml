architecture: standalone

auth:
  enabled: true
  rootUser: root
  # If rootPassword is empty, Bitnami will auto-generate one and store it in a Secret.
  rootPassword: ""

persistence:
  enabled: true
  size: 8Gi
  storageClass: gp2  # <-- change this if your StorageClass name is different

service:
  type: ClusterIP
  port: 27017

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
