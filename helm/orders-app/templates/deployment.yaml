apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orders-app.fullname" . }}
  labels:
    {{- include "orders-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "orders-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orders-app.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "orders-app.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: orders-app-mongo
                  key: mongo-uri

            - name: MONGO_DB
              value: {{ .Values.appConfig.mongoDb | quote }}

            - name: MONGO_COLLECTION
              value: {{ .Values.appConfig.mongoCollection | quote }}

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

